# Builds GAZE for Windows and Linux and publishes a GitHub release when a
# version tag is pushed (e.g. `git tag v0.5.0 && git push origin v0.5.0`).
# GAZE installations find the release, download the program for their
# system and update themselves (Settings → About).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: target/release/nvr.exe
            asset: nvr-windows-x64.exe
          - os: ubuntu-22.04
            exe: target/release/nvr
            asset: nvr-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          cd dist
          sha256sum "${{ matrix.asset }}" | cut -d' ' -f1 > "${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          # The section of CHANGELOG.md for this version.
          awk -v v="$v" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "GAZE $v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: GAZE ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
