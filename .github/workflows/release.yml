# Builds GAZE for Windows and publishes a GitHub release.
#
# A release is made when:
# - a commit titled "Version <x.y.z>" that raises the version in Cargo.toml
#   is pushed to the default branch and there is no release for it yet
#   (the tag v<version> is created automatically; the run is listed in
#   Actions as "Version x.y.z"), or
# - a version tag is pushed by hand (git tag v0.6.0 && git push origin v0.6.0).
#
# - "Run workflow" is started by hand on the default branch and the version
#   in Cargo.toml has no release yet (e.g. to retry a failed release).
#
# GAZE installations find the release, download the program for their
# system and update themselves (Settings → About). On another branch, "Run
# workflow" only builds (the program is attached to the run).
name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_TITLE: ${{ github.event.head_commit.message }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          release=false
          released() { gh release view "v$v" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; }
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            release=true
          elif [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            released || release=true
          elif [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ] \
               && [ "$(printf '%s' "$HEAD_TITLE" | head -n1)" = "Version $v" ]; then
            # Only versions that haven't been released yet.
            released || release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $v, release: $release"

  build:
    needs: version
    # A push that doesn't release builds nothing.
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: target/release/nvr.exe
            asset: nvr-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        # Updates of this build come from this repository's releases.
        env:
          GAZE_UPDATE_REPO: ${{ github.repository }}
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir dist
          # GAZE.exe for new installs; the older name too, for installs
          # from before 0.6.73 to find their update.
          cp "${{ matrix.exe }}" "dist/GAZE.exe"
          cp "${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          cd dist
          for f in GAZE.exe "${{ matrix.asset }}"; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          # The section of CHANGELOG.md for this version.
          awk -v v="$v" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "GAZE $v" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GAZE v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
