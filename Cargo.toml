[package]
name = "nvr"
version = "0.6.66"
edition = "2024"
description = "GAZE — network video recorder for IP cameras"

[dependencies]
if-addrs = "0.15"
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
fs4 = "1.1.0"
futures-util = "0.3.34"
jpeg-encoder = "0.7.1"
jpeg-decoder = { version = "0.3", default-features = false }
flate2 = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tract-onnx = "0.23"
md-5 = "0.11"
sha2 = "0.11"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rumqttc = { version = "0.25.1", default-features = false }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
nu-ansi-term = "0.50"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Console", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Services", "Win32_System_Threading"] }

# Optimize dependencies even in debug builds: the built-in AI model is far
# too slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
