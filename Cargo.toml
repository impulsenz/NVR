[package]
name = "nvr"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
fs4 = "1.1.0"
futures-util = "0.3.34"
jpeg-encoder = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tract-onnx = "0.23"

[target.'cfg(windows)'.dependencies]
nu-ansi-term = "0.50"

# Optimize dependencies even in debug builds: the built-in AI model is far
# too slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
