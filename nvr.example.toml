# NVR configuration. Copy to nvr.toml and edit.

[server]
# Address and port of the web interface.
listen = "0.0.0.0:8080"
# Set both to require a login (HTTP basic auth). Leave empty to disable.
username = ""
password = ""
# Path to the ffmpeg binary.
ffmpeg_path = "ffmpeg"

[camera]
name = "Front Door"
# Main (high quality) stream, used for recording.
url = "rtsp://admin:password@192.168.1.50:554/stream1"
# Optional sub-stream (lower resolution) for the live view; uses `url` when empty.
live_url = ""

[recording]
dir = "recordings"
# Start recording as soon as the NVR starts.
record_on_start = true
# Length of each recording file, in seconds.
segment_seconds = 300
# Record audio (re-encoded to AAC).
record_audio = false
# Delete recordings older than this many days (0 = keep forever).
retention_days = 14
# Delete oldest recordings when the folder grows beyond this many GB (0 = unlimited).
max_storage_gb = 0

[live]
# Live view frame rate, width (0 = native) and JPEG quality (2 = best, 31 = worst).
fps = 5
width = 1280
quality = 6
